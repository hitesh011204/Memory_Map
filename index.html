<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#2e6b50">
    <meta name="description" content="Save your places, photos, and memories on your personal map.">

    <title>Memory Map</title>

    <!-- Leaflet map styles -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- Application styles -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <!-- ================================= -->
    <!-- FULL-SCREEN MAP                  -->
    <!-- ================================= -->

    <main id="map" aria-label="Your personal memory map"></main>


    <!-- ================================= -->
    <!-- FLOATING PLACE SEARCH            -->
    <!-- ================================= -->

    <section
        id="search-panel"
        class="search-panel is-hidden"
        aria-label="Search for a place"
    >

        <form id="search-form">
            <input
                type="search"
                id="search-input"
                placeholder="Search for a place..."
                aria-label="Place name"
                autocomplete="off"
                required
            >

            <button type="submit" id="search-button">
                Search
            </button>

            <button
                type="button"
                id="hide-search"
                aria-label="Hide search"
            >
                ×
            </button>
        </form>

        <div
            id="search-results"
            role="list"
            aria-live="polite"
        ></div>

    </section>


    <!-- ================================= -->
    <!-- MAP CONTROLS                      -->
    <!-- ================================= -->

    <div class="map-controls">

        <button
            id="search-toggle"
            type="button"
            aria-label="Show place search"
            aria-expanded="false"
        >
            Search
        </button>

        <button
            id="locate-btn"
            type="button"
            aria-label="Find my current location"
        >
            ◎ My Location
        </button>

    </div>


    <!-- ================================= -->
    <!-- ADD OR EDIT MEMORY                -->
    <!-- ================================= -->

    <div
        id="memory-modal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="memory-form-heading"
        hidden
    >

        <form id="memory-form" class="memory-form">

            <h2 id="memory-form-heading">Add a Memory</h2>

            <label for="memory-title">Title</label>
            <input
                type="text"
                id="memory-title"
                placeholder="e.g. Evening at the lake"
                maxlength="120"
                required
            >

            <label for="memory-notes">Your Notes</label>
            <textarea
                id="memory-notes"
                placeholder="What do you want to remember?"
                rows="4"
            ></textarea>


            <!-- Multiple photos per memory -->
            <label for="memory-photo">Add Photos</label>
            <input
                type="file"
                id="memory-photo"
                accept="image/*"
                multiple
            >

            <p class="photo-help">
                Select multiple photos. When editing, new photos
                will be added to the existing collection.
            </p>

            <p
                id="current-photo-label"
                class="current-photo-label"
                aria-live="polite"
            ></p>


            <!-- Memory coordinates -->
            <label for="memory-lat">Latitude</label>
            <input
                type="number"
                id="memory-lat"
                step="any"
                min="-90"
                max="90"
                required
            >

            <label for="memory-lon">Longitude</label>
            <input
                type="number"
                id="memory-lon"
                step="any"
                min="-180"
                max="180"
                required
            >


            <!-- Form actions -->
            <div class="memory-actions">

                <button type="submit" id="save-memory">
                    Save Memory
                </button>

                <button type="button" id="cancel-memory">
                    Cancel
                </button>

            </div>

        </form>

    </div>


    <!-- ================================= -->
    <!-- FULL-SCREEN MEMORY VIEWER         -->
    <!-- ================================= -->

    <div
        id="memory-view-modal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="view-memory-title"
        hidden
    >

        <article class="memory-view">

            <button
                type="button"
                id="close-memory-view"
                class="close-view"
                aria-label="Close memory"
            >
                ×
            </button>


            <div class="memory-view-content">

                <h2 id="view-memory-title"></h2>

                <p id="view-memory-notes"></p>

                <p
                    id="view-memory-location"
                    class="memory-location"
                ></p>


                <!-- JavaScript inserts all saved photos here -->
                <div
                    id="memory-photo-gallery"
                    class="memory-photo-gallery"
                    aria-label="Memory photos"
                ></div>


                <div class="memory-actions">

                    <button type="button" id="edit-memory">
                        Edit Memory
                    </button>

                    <button type="button" id="close-memory-button">
                        Close
                    </button>

                </div>

            </div>

        </article>

    </div>


    <!-- ================================= -->
    <!-- JAVASCRIPT                       -->
    <!-- ================================= -->

    <!-- Leaflet must load before script.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Application logic -->
    <script src="script.js"></script>

</body>
</html>
